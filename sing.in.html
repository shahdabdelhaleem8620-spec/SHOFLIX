<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in - SHOFLIX</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body style="min-height:100vh;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),url('image/image1.jpg') center/cover no-repeat;">

    <header class="px-3 px-md-5 py-4">
        <a href="index.html" class="fs-1 fw-bolder text-decoration-none" style="color:#e50914;letter-spacing:2px;">SHOFLIX</a>
    </header>

    <main class="container d-flex justify-content-center py-4">
        <div class="p-4 p-md-5 rounded-4" style="width:100%;max-width:450px;background:rgba(0,0,0,.8);">
            <h1 class="fw-bolder mb-4">Sign In</h1>

            <div class="mb-3">
                <input type="email" class="form-control form-control-lg bg-black text-white" placeholder="Email address">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control form-control-lg bg-black text-white" placeholder="Password">
            </div>

            <button class="btn btn-danger btn-lg w-100 mt-2">Sign In</button>

            <div class="d-flex justify-content-between align-items-center mt-3 small text-secondary">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <a href="#" class="text-secondary">Need help?</a>
            </div>

            <p class="mt-5 text-secondary">New to SHOFLIX? <a href="index.html" class="text-white">Sign up now</a>.</p>
        </div>
    </main>

    <script src="css/bootstrap.bundle.min.js"></script>
</body>

</html>
